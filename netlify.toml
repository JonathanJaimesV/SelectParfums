[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Versión fija de Node para que el build no cambie solo (Vite moderno + scripts con node:test/fileURLToPath)
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP ajustada a lo que usa la tienda: scripts solo propios (sin inline), estilos propios + en línea de React + Google Fonts,
    # imágenes propias/data:, solo se permite conectar con el propio sitio y con Supabase (https://*.supabase.co). Si agregas analítica, chat u otro servicio, añade su dominio aquí.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Fotos de producto: caché de 1 semana (las rutas no llevan hash, así que no se marcan como inmutables)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SPA: todas las rutas (/catalogo, /marcas...) las resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
